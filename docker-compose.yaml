services:
  db:
    image: postgres:17
    container_name: bitewise-postgres
    environment:
      POSTGRES_USER: bitewise
      POSTGRES_PASSWORD: bitewise_dev_password
      POSTGRES_DB: bitewise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: